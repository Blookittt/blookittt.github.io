<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% if page.title and page.title != "home" %}{{ page.title | escape }} / {% endif %}FORTUNA</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  {% if site.data.weekly.song_audio and site.data.weekly.song_audio != "" %}
  <audio id="bg-song" preload="metadata" loop>
    <source src="{{ site.data.weekly.song_audio }}" type="audio/mpeg">
  </audio>
  {% endif %}

  <div class="site-shell">
    <header class="site-header">
      <div>
        <a class="site-name" href="/">FORTUNA</a>
        <div class="site-subtitle">personal pages / logs / found things / daily apparatus</div>
      </div>

      <div class="account-stub">
        SIGNED IN AS<br>
        <strong>BLOO № 17•421</strong><br>
        FAVOR: 284
      </div>
    </header>

    <nav class="site-nav" aria-label="main navigation">
      <a href="/">HOME</a>
      <a href="/archive/">ARCHIVE</a>
      <a href="/archive/#log">LOG</a>
      <a href="/archive/#found">FOUND</a>
      <a href="/archive/#music">MUSIC</a>
      <a href="/archive/#scrap">SCRAPS</a>
    </nav>

    <div class="page-wrap">
      {{ content }}
    </div>

    <footer class="site-footer">
      <span>FORTUNA</span>
      <span>bloofortune.com</span>
      <span>LUCKY YOU</span>
    </footer>
  </div>

  <script>
  (() => {
    const audio = document.getElementById('bg-song');
    const toggle = document.getElementById('audio-toggle');
    const slider = document.getElementById('audio-volume');
    const readout = document.getElementById('volume-readout');

    if (!audio || !toggle || !slider || !readout) return;

    const saved = Number(localStorage.getItem('fortunaVolume'));
    const initial = Number.isFinite(saved) ? Math.max(0, Math.min(100, saved)) : 8;
    slider.value = String(initial);
    audio.volume = initial / 100;
    readout.textContent = String(initial).padStart(2, '0');

    const update = () => {
      toggle.textContent = audio.paused ? 'PLAY' : 'STOP';
    };

    toggle.addEventListener('click', async () => {
      if (audio.paused) {
        try { await audio.play(); } catch (_) {}
      } else {
        audio.pause();
      }
      update();
    });

    slider.addEventListener('input', () => {
      const v = Math.max(0, Math.min(100, Number(slider.value) || 0));
      audio.volume = v / 100;
      localStorage.setItem('fortunaVolume', String(v));
      readout.textContent = String(v).padStart(2, '0');
    });

    update();
  })();
  </script>

  <script>
  (() => {
    const machine = document.getElementById('fortuna-machine');
    const rollers = document.getElementById('daily-lucky-numbers');
    const trigger = document.getElementById('lucky-trigger');
    const lamp = document.getElementById('fortuna-lamp');
    const kicker = document.getElementById('screen-kicker');
    const main = document.getElementById('screen-main');
    const sub = document.getElementById('screen-sub');
    const reading = document.getElementById('lucky-reading');

    if (!machine || !rollers || !trigger || !kicker || !main || !sub) return;

    const message = machine.dataset.fortuneText || 'Lucky you.';
    const fortuneNo = Number.parseInt(machine.dataset.fortuneNo || '0', 10) || 0;
    const songTitle = machine.dataset.songTitle || '';

    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = now.getMonth() + 1;
    const dd = now.getDate();
    const yy = yyyy % 100;
    const weekday = now.getDay();
    const start = new Date(yyyy, 0, 0);
    const dayOfYear = Math.floor((now - start) / 86400000);
    const dateKey = yyyy + '-' + String(mm).padStart(2,'0') + '-' + String(dd).padStart(2,'0');

    const words = message.split(/\s+/).filter(Boolean);
    const letters = (message.match(/[A-Za-z]/g) || []).length;
    const vowels = (message.match(/[AEIOUaeiou]/g) || []).length;
    const consonants = Math.max(0, letters - vowels);
    const punctuation = (message.match(/[^A-Za-z0-9\s]/g) || []).length;
    const apostrophes = (message.match(/['’]/g) || []).length;
    const songWords = songTitle.split(/\s+/).filter(Boolean).length;

    const hash = (str) => {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    };

    const chars = (str) => Array.from(str).reduce((sum, ch, i) => sum + ch.charCodeAt(0) * (i + 3), 0);
    const rng = (seed) => () => {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    const norm = (n) => ((Math.abs(Math.trunc(n)) - 1) % 60 + 60) % 60 + 1;

    const seed = hash(dateKey + '|' + message + '|' + fortuneNo + '|' + songTitle);
    const random = rng(seed);
    const middleWord = words.length ? words[Math.floor(words.length / 2)] : '';
    const firstWord = words[0] || '';
    const lastWord = words[words.length - 1] || '';
    const blooConstant = 17;

    const nonsense = [
      dd, mm, yy, dd + mm, dd + yy, mm * dd, dayOfYear,
      words.length, letters, vowels, consonants, punctuation,
      fortuneNo, fortuneNo + dd, fortuneNo + words.length,
      norm(Math.floor((dayOfYear + (yyyy % 19) * 11 + dd * 3) * .87)),
      norm((weekday + 1) * 7 + dd + punctuation),
      norm(apostrophes * 13 + 3 + mm),
      norm(consonants - vowels + yy),
      norm(chars(middleWord) + middleWord.length * dd),
      norm(chars(firstWord) - chars(lastWord) + dayOfYear),
      norm((dd * mm) + yy + letters + 24 + 7),
      norm(chars(songTitle) + songWords * 11),
      blooConstant,
      norm(hash(message + 'lucky') % 60),
      norm(hash(songTitle + 'you') % 60)
    ].map(norm);

    const weighted = [
      ...nonsense,
      norm(dd), norm(dd), norm(dd),
      norm(mm), norm(mm),
      norm(words.length + dd),
      norm(fortuneNo + dd),
      norm(dayOfYear + songWords + blooConstant)
    ];

    const picks = [];
    const used = new Set();

    while (picks.length < 6) {
      let candidate = random() < .86
        ? weighted[Math.floor(random() * weighted.length)]
        : 1 + Math.floor(random() * 60);

      let guard = 0;
      const hop = 3 + ((dd + weekday + fortuneNo) % 11);
      while (used.has(candidate) && guard < 60) {
        candidate = norm(candidate + hop + punctuation + (guard % 5));
        guard++;
      }

      if (!used.has(candidate)) {
        used.add(candidate);
        picks.push(candidate);
      }
    }

    for (let i = picks.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [picks[i], picks[j]] = [picks[j], picks[i]];
    }

    const boxes = Array.from(rollers.querySelectorAll('.lucky-number'));
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let busy = false;

    const setDisplay = (a, b, c) => {
      kicker.textContent = a || '';
      main.textContent = b || '';
      sub.textContent = c || '';
      machine.classList.remove('screen-pop');
      void machine.offsetWidth;
      machine.classList.add('screen-pop');
    };

    const sleep = (ms) => new Promise(resolve => window.setTimeout(resolve, ms));

    const localRandom = (boxIndex, digitIndex) => rng(
      seed ^
      ((boxIndex + 1) * 0x45d9f3b) ^
      ((digitIndex + 1) * 0x27d4eb2d)
    );

    const reset = () => {
      machine.classList.remove('awake', 'shutters-open', 'fortune-revealed', 'machine-finished');
      lamp.classList.remove('on', 'flicker');
      boxes.forEach((box, i) => {
        box.classList.remove('rolling', 'settled');
        const digits = box.querySelectorAll('.lucky-digit');
        digits.forEach((digit, d) => {
          digit.className = 'lucky-digit';
          digit.textContent = String((8 - i - d + 10) % 10);
        });
      });
      setDisplay('FORTUNA', 'LUCKY YOU', 'PRESS ASK');
    };

    const rollDigit = async (digit, targetChar, r) => {
      const target = Number(targetChar);
      let current = 9 - Math.floor(r() * 3);
      digit.textContent = String(current);

      const down = async (delay) => {
        current = (current - 1 + 10) % 10;
        digit.textContent = String(current);
        digit.classList.add('tick');
        await sleep(reduced ? 1 : delay);
        digit.classList.remove('tick');
      };

      for (let i = 0; i < (reduced ? 1 : 10); i++) await down(28 + i * 3);
      for (let i = 0; i < (reduced ? 0 : 6); i++) await down(55 + i * 7);

      let clicks = 0;
      while ((current !== target || clicks < 2) && clicks < 24) {
        await down(105 + Math.min(clicks, 8) * 8);
        clicks++;
      }

      if (!reduced) {
        digit.classList.add('near');
        await sleep(150);
        digit.classList.remove('near');
        await down(160);
        digit.classList.add('slip');
        await sleep(120);
        digit.classList.remove('slip');

        clicks = 0;
        while ((current !== target || clicks < 3) && clicks < 24) {
          await down(145 + Math.min(clicks, 8) * 10);
          clicks++;
        }
      }

      digit.textContent = targetChar;
      digit.classList.add('locked');
    };

    const runBox = async (index) => {
      const box = boxes[index];
      const target = String(picks[index]).padStart(2, '0');
      const digits = Array.from(box.querySelectorAll('.lucky-digit'));
      box.classList.add('rolling');

      await Promise.all(
        digits.map((digit, d) => sleep(d * (reduced ? 0 : 70)).then(() => rollDigit(digit, target[d], localRandom(index, d))))
      );

      box.classList.remove('rolling');
      box.classList.add('settled');
      setDisplay('FORTUNA', 'NUMBER ' + (index + 1) + ' / 6', 'ACCEPTED');
      await sleep(reduced ? 20 : 210);
    };

    const revealFortune = async () => {
      setDisplay('', '', '');
      await sleep(reduced ? 10 : 240);
      machine.classList.add('fortune-revealed');

      kicker.textContent = 'FORTUNA';
      main.textContent = message;
      sub.textContent = 'FORTUNE No. ' + String(fortuneNo || '???').padStart(3, '0') + '  /  FAVOR +17';

      machine.classList.remove('screen-pop');
      void machine.offsetWidth;
      machine.classList.add('screen-pop');

      if (reading) {
        reading.textContent = message + '. Lucky numbers: ' + picks.join(', ') + '.';
      }
    };

    const ask = async () => {
      if (busy) return;
      busy = true;
      trigger.disabled = true;
      reset();

      trigger.classList.add('down');
      setDisplay('FORTUNA', 'PLEASE WAIT', '');
      await sleep(reduced ? 20 : 180);

      lamp.classList.add('flicker');
      await sleep(reduced ? 20 : 620);
      lamp.classList.remove('flicker');
      lamp.classList.add('on');
      machine.classList.add('awake');
      trigger.classList.remove('down');

      setDisplay('FORTUNA', 'CONSIDERING', 'THE MATTER');
      await sleep(reduced ? 30 : 760);

      machine.classList.add('shutters-open');
      await sleep(reduced ? 40 : 980);

      for (let i = 0; i < boxes.length; i++) {
        setDisplay('FORTUNA', 'NUMBER ' + (i + 1) + ' / 6', 'IN MOTION');
        await runBox(i);
      }

      machine.classList.add('machine-finished');
      await revealFortune();

      trigger.disabled = false;
      busy = false;
    };

    trigger.addEventListener('click', ask);

    machine.addEventListener('pointerenter', () => {
      if (!busy && !machine.classList.contains('fortune-revealed')) {
        sub.textContent = 'READY';
      }
    });

    machine.addEventListener('pointerleave', () => {
      if (!busy && !machine.classList.contains('fortune-revealed')) {
        sub.textContent = 'PRESS ASK';
      }
    });

    reset();
  })();
  </script>
</body>
</html>
