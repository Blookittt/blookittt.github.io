  <script>
  (() => {
    const audio = document.getElementById('bg-song');
    const toggle = document.getElementById('audio-toggle');
    const slider = document.getElementById('audio-volume');
    const readout = document.getElementById('volume-readout');

    if (!audio || !toggle || !slider || !readout) return;

    const saved = Number(localStorage.getItem('fortunaVolume'));
    const initial = Number.isFinite(saved) ? Math.max(0, Math.min(100, saved)) : 8;
    slider.value = String(initial);
    audio.volume = initial / 100;
    readout.textContent = String(initial).padStart(2, '0');

    const update = () => {
      toggle.textContent = audio.paused ? 'PLAY' : 'STOP';
    };

    toggle.addEventListener('click', async () => {
      if (audio.paused) {
        try { await audio.play(); } catch (_) {}
      } else {
        audio.pause();
      }
      update();
    });

    slider.addEventListener('input', () => {
      const v = Math.max(0, Math.min(100, Number(slider.value) || 0));
      audio.volume = v / 100;
      localStorage.setItem('fortunaVolume', String(v));
      readout.textContent = String(v).padStart(2, '0');
    });

    update();
  })();
  </script>

      const a = clean.slice(0, Math.max(1, Math.floor(clean.length / 2) - 1));

      const drop = a + b.slice(1);

      main.textContent = prefix ? prefix + ' ' : '';

      for (const attempt of wrong.slice(0,4)) {
        main.textContent = (prefix ? prefix + ' ' : '') + attempt;
        main.classList.remove('word-step');
        void main.offsetWidth;
        main.classList.add('word-step');
        await sleep(reduced ? 1 : 620);
      }

      main.textContent = (prefix ? prefix + ' ' : '') + 'FUCK';
      await sleep(reduced ? 1 : 1050);

      let built = '';
      for (const ch of target) {
        built += ch;
        main.textContent = (prefix ? prefix + ' ' : '') + built;
        await sleep(reduced ? 1 : 230);
      }

      for (const word of suffix) {
        main.textContent += ' ' + word;
        main.classList.remove('word-step');
        void main.offsetWidth;
        main.classList.add('word-step');
        await sleep(reduced ? 1 : 235);
      }

      if (!reduced) await sleep(220);
    };

    const runRareAfterFortune = async () => {
      if (!activeRareEvent) return;

      const normalSub =
        'FORTUNE No. ' +
        String(fortuneNo || '???').padStart(3, '0') +
        '  /  FAVOR +17';

      switch (activeRareEvent.id) {
        case 'bonusZero':
          sub.textContent = 'BONUS FAVOR +0';
          popScreen();
          await sleep(reduced ? 1 : 1250);
          sub.textContent = normalSub;
          break;

        case 'tooMuchFavor':
          sub.textContent = 'FAVOR +999999';
          popScreen();
          await sleep(reduced ? 1 : 900);
          sub.textContent = normalSub;
          break;

        case 'coinReturn':
          machine.classList.add('coin-returned');
          sub.textContent = 'RETURNING COIN';
          popScreen();
          await sleep(reduced ? 1 : 1000);
          sub.textContent = normalSub;
          break;

        case 'favorDenied':
          sub.textContent = 'FAVOR DENIED';
          popScreen();
          await sleep(reduced ? 1 : 900);
          sub.textContent = normalSub;
          break;

        case 'thatWasWeird':
          sub.textContent = 'THAT WAS WEIRD.';
          popScreen();
          await sleep(reduced ? 1 : 1200);
          sub.textContent = normalSub;
          break;

        case 'tonyHi':
          sub.textContent = 'TELL TONY I SAID HI.';
          popScreen();
          await sleep(reduced ? 1 : 1500);
          sub.textContent = normalSub;
          break;
      }
    };

    const reset = () => {
      machine.classList.remove(
        'awake',
        'computing',
        'shutters-open',
        'fortune-revealed',
        'machine-finished',
        'screen-pop'
      );

      lamp.classList.remove('on', 'flicker');
      machine.classList.remove('coin-returned');
      numberRegretUsed = false;
      progressToken++;
      setProgress(0);

      boxes.forEach((box, i) => {
        box.classList.remove('rolling', 'settled');
        const digits = box.querySelectorAll('.lucky-digit');

        digits.forEach((digit, d) => {
          digit.className = 'lucky-digit';
          digit.textContent = String((8 - i - d + 10) % 10);
        });
      });

      setDisplay('FORTUNA', 'LUCKY YOU', 'PRESS ASK');
    };

    const runDiagnostics = async () => {
      machine.classList.add('computing');
      const diagnostics = chooseDiagnostics();

      for (let i = 0; i < diagnostics.length; i++) {
        const item = diagnostics[i];
        kicker.textContent = 'FORTUNA / COMPUTE ' + String(i + 1).padStart(2,'0');
        sub.textContent = item.detail;
        await writeWords(main, item.text, 190);
        await sleep(reduced ? 1 : 520);
      }

      machine.classList.remove('computing');
    };

    const rollDigit = async (digit, targetChar, r) => {
      const target = Number(targetChar);
      let current = 9 - Math.floor(r() * 3);
      digit.textContent = String(current);

      const down = async (delay) => {
        current = (current - 1 + 10) % 10;
        digit.textContent = String(current);
        digit.classList.add('tick');
        await sleep(reduced ? 1 : delay);
        digit.classList.remove('tick');
      };

      for (let i = 0; i < (reduced ? 1 : 6); i++) {
        await down(24 + i * 2);
      }

      for (let i = 0; i < (reduced ? 0 : 3); i++) {
        await down(44 + i * 5);
      }

      let clicks = 0;
      while ((current !== target || clicks < 2) && clicks < 14) {
        await down(64 + Math.min(clicks, 6) * 4);
        clicks++;
      }

      if (!reduced) {
        digit.classList.add('near');
        await sleep(88);
        digit.classList.remove('near');

        await down(92);
        digit.classList.add('slip');
        await sleep(72);
        digit.classList.remove('slip');

        clicks = 0;
        while ((current !== target || clicks < 3) && clicks < 14) {
          await down(84 + Math.min(clicks, 6) * 5);
          clicks++;
        }
      }

      digit.textContent = targetChar;
      digit.classList.add('locked');
    };

    const runBox = async (index) => {
      const box = boxes[index];
      const target = String(picks[index]).padStart(2, '0');
      const digits = Array.from(box.querySelectorAll('.lucky-digit'));

      box.classList.add('rolling');

      kicker.textContent = 'FORTUNA / DRAW ' + String(index + 1).padStart(2,'0');
      sub.textContent = 'CHANNEL ' + String(index + 1).padStart(2,'0') + ' / ACTIVE';
      const screenWords = writeWords(main, 'NUMBER ' + (index + 1) + ' IN MOTION', 155);

      await Promise.all([
        screenWords,
        ...digits.map((digit, d) =>
          sleep(d * (reduced ? 0 : 48))
            .then(() => rollDigit(digit, target[d], localRandom(index, d)))
        )
      ]);

      box.classList.remove('rolling');
      box.classList.add('settled');

      if (
        activeRareEvent &&
        activeRareEvent.id === 'numberRegret' &&
        !numberRegretUsed &&
        index === 2
      ) {
        numberRegretUsed = true;
        await say('WAIT.', '', 650, 260);
        box.classList.add('regret');
        box.classList.remove('settled');
        await sleep(reduced ? 1 : 560);
        box.classList.remove('regret');
        await sleep(reduced ? 1 : 420);

        await Promise.all(
          digits.map((digit, d) =>
            sleep(d * (reduced ? 0 : 48))
              .then(() => rollDigit(digit, target[d], rng(seed ^ 0xBADF00D ^ (index + 1) ^ (d + 1))))
          )
        );

        box.classList.add('settled');
      }

      kicker.textContent = 'FORTUNA / DRAW ' + String(index + 1).padStart(2,'0');
      sub.textContent = 'VALUE ACCEPTED';
      await writeWords(main, 'NUMBER ' + (index + 1) + ' LOCKED', 145);
      await sleep(reduced ? 5 : 105);
    };

    const revealFortune = async () => {
      setDisplay('', '', '');
      await sleep(reduced ? 5 : 360);

      machine.classList.add('fortune-revealed');
      kicker.textContent = 'FORTUNA';
      sub.textContent = '';

      if (activeRareEvent && activeRareEvent.id === 'wrongFortune') {
        await writeWords(main, 'YOUR CAR KNOWS TOO MUCH', 235);
        await sleep(reduced ? 1 : 900);
        await say('NO', '', 500, 260);
        kicker.textContent = 'FORTUNA';
        sub.textContent = '';
      }

      if (activeRareEvent && activeRareEvent.id === 'spellingProblem') {
        await writeFortuneWithSpellingProblem();
      } else {
        await writeWords(main, message, 235);
      }

      sub.textContent =
        'FORTUNE No. ' +
        String(fortuneNo || '???').padStart(3, '0') +
        '  /  FAVOR +17';

      popScreen();

      if (reading) {
        reading.textContent = message + '. Lucky numbers: ' + picks.join(', ') + '.';
      }
    };

    const ask = async () => {
      if (busy) return;

      busy = true;
      trigger.disabled = true;
      activeRareEvent = selectRareEvent();
      reset();
      startFakeProgress();

      document.body.classList.add('fortuna-power-draw');
      trigger.classList.add('down');

      kicker.textContent = 'FORTUNA / QUERY';
      sub.textContent = 'INPUT ACCEPTED';
      await writeWords(main, 'QUERY ACCEPTED', 190);

      lamp.classList.add('flicker');
      await sleep(reduced ? 15 : 760);

      lamp.classList.remove('flicker');
      lamp.classList.add('on');
      machine.classList.add('awake');
      trigger.classList.remove('down');

      const continueConsultation = await runRareBeforeCompute();

      if (!continueConsultation) {
        await finishFakeProgress();
        document.body.classList.remove('fortuna-power-draw');
        trigger.disabled = false;
        busy = false;
        return;
      }

      await runDiagnostics();

      kicker.textContent = 'FORTUNA / DRAW';
      sub.textContent = 'BANK PREP';
      await writeWords(main, 'PREPARING DRAW', 175);

      machine.classList.add('shutters-open');
      await sleep(reduced ? 30 : 1120);

      if (activeRareEvent && activeRareEvent.id === 'fourthFirst') {
        await runBox(3);
        for (const i of [0,1,2,4,5]) await runBox(i);
      } else {
        for (let i = 0; i < boxes.length; i++) {
          await runBox(i);
        }
      }

      machine.classList.add('machine-finished');
      await revealFortune();
      await runRareAfterFortune();
      await finishFakeProgress();

      await sleep(reduced ? 10 : 760);
      document.body.classList.remove('fortuna-power-draw');

      trigger.disabled = false;
      busy = false;
    };

    trigger.addEventListener('click', ask);

    machine.addEventListener('pointerenter', () => {
      if (!busy && !machine.classList.contains('fortune-revealed')) {
        sub.textContent = 'READY';
      }
    });

    machine.addEventListener('pointerleave', () => {
      if (!busy && !machine.classList.contains('fortune-revealed')) {
        sub.textContent = 'PRESS ASK';
      }
    });

    reset();
  })();
  </script>
</body>
</html>
