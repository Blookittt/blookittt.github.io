---
layout: default
title: edit profile
permalink: /edit-profile/
---
<div class="settings-page">
  <div class="section-title-row settings-title">
    <h1>EDIT PROFILE</h1>
  </div>

  <form id="profile-settings" class="settings-form">
    <fieldset>
      <legend>IDENTITY</legend>

      <label>
        <span>DISPLAY NAME</span>
        <input name="displayName" maxlength="28" autocomplete="off">
      </label>

      <label>
        <span>FORTUNE ID</span>
        <div>
          <input name="fortuneId" maxlength="18" autocomplete="off" readonly>
          <div class="settings-help">assigned once / not editable</div>
        </div>
      </label>

      <label>
        <span>STATUS</span>
        <input name="status" maxlength="80" autocomplete="off">
      </label>

      <label>
        <span>BIO</span>
        <textarea name="bio" rows="7" maxlength="1000"></textarea>
      </label>

      <label>
        <span>AVATAR URL</span>
        <input name="avatarUrl" type="url" placeholder="https://...">
      </label>
    </fieldset>

    <fieldset>
      <legend>PAGE</legend>

      <label>
        <span>PAGE COLOR</span>
        <div class="color-input-row">
          <input name="pageColor" type="color">
          <input name="pageColorText" maxlength="7" autocomplete="off">
        </div>
      </label>

      <label>
        <span>LINK COLOR</span>
        <div class="color-input-row">
          <input name="linkColor" type="color">
          <input name="linkColorText" maxlength="7" autocomplete="off">
        </div>
      </label>

      <label>
        <span>FORTUNA ACCENT</span>
        <div class="color-input-row">
          <input name="accentColor" type="color">
          <input name="accentColorText" maxlength="7" autocomplete="off">
        </div>
      </label>

      <label>
        <span>CURRENT SONG</span>
        <input name="currentSong" maxlength="120" autocomplete="off">
      </label>
    </fieldset>

    <fieldset>
      <legend>EMBEDS</legend>
      <p class="settings-help">YouTube, Spotify, image, or plain link.</p>

      <label><span>EMBED 1</span><input name="embed1" type="url" placeholder="https://..."></label>
      <label><span>EMBED 2</span><input name="embed2" type="url" placeholder="https://..."></label>
      <label><span>EMBED 3</span><input name="embed3" type="url" placeholder="https://..."></label>
    </fieldset>

    <div class="settings-actions">
      <button class="old-button" type="submit">SAVE PAGE</button>
      <a class="old-button link-button" href="/profile/">VIEW PAGE</a>
      <span id="settings-result" class="settings-result" aria-live="polite"></span>
    </div>
  </form>
</div>

<script>
(() => {
  if (!window.FortunaProfile) return;

  const form = document.getElementById('profile-settings');
  const result = document.getElementById('settings-result');
  const validHex = value => /^#[0-9a-f]{6}$/i.test(value || '');
  const profile = FortunaProfile.load();

  const fill = p => {
    for (const key of ['displayName','fortuneId','status','bio','avatarUrl','currentSong','embed1','embed2','embed3']) {
      if (form.elements[key]) form.elements[key].value = p[key] || '';
    }

    for (const key of ['pageColor','linkColor','accentColor']) {
      form.elements[key].value = p[key];
      form.elements[key + 'Text'].value = p[key];
    }
  };

  const syncPair = key => {
    const picker = form.elements[key];
    const text = form.elements[key + 'Text'];

    picker.addEventListener('input', () => text.value = picker.value);
    text.addEventListener('input', () => {
      if (validHex(text.value)) picker.value = text.value;
    });
  };

  ['pageColor','linkColor','accentColor'].forEach(syncPair);
  fill(profile);

  form.addEventListener('submit', event => {
    event.preventDefault();
    const current = FortunaProfile.load();
    const next = Object.assign({}, current);

    for (const key of ['displayName','status','bio','avatarUrl','currentSong','embed1','embed2','embed3']) {
      next[key] = form.elements[key].value.trim();
    }

    for (const key of ['pageColor','linkColor','accentColor']) {
      const text = form.elements[key + 'Text'].value.trim();
      next[key] = validHex(text) ? text : form.elements[key].value;
    }

    FortunaProfile.save(next);
    result.textContent = 'SAVED.';
    window.setTimeout(() => result.textContent = '', 1600);
  });
})();
</script>
